name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'GitHub Environment to deploy to'
        required: true
        type: choice
        options:
          - Development
          - UAT
          - Production
      artifact_run_id:
        description: 'Run ID of the Build and Deploy Dev workflow (leave empty for latest successful build)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      artifact_run_id:
        description: 'The workflow run ID to download the artifact from (leave empty to use current run)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Secrets and variables below are resolved from the named GitHub Environment,
    # so each environment (Development, UAT, Production) can use its own Azure
    # service connection by configuring the following in
    # Settings → Environments → <environment name>:
    #
    # Secrets:
    #   AZURE_CLIENT_ID       — App Registration client ID for this environment
    #   AZURE_CLIENT_SECRET   — App Registration client secret for this environment
    #   AZURE_TENANT_ID       — Azure AD tenant ID for this environment
    #   AZURE_SUBSCRIPTION_ID — Azure subscription ID for this environment
    #
    # Variables:
    #   APP_NAME              — Azure Web App name for this environment
    #
    # Dev and UAT can share one service connection (same values) while Production
    # uses a completely different service connection (different values) — simply
    # configure the secrets/variables independently per environment.
    environment:
      name: ${{ inputs.environment_name }}

    steps:
      - name: Resolve Artifact Run ID
        id: resolve-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          if [ -n "$REQUESTED_RUN_ID" ]; then
            run_id="$REQUESTED_RUN_ID"
          else
            run_id=$(gh api \
              --method GET \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/build-and-deploy-dev.yml/runs" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].id')
          fi

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful Build and Deploy Dev workflow run was found." >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using artifact from workflow run $run_id"

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          run-id: ${{ steps.resolve-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Get GitHub Runner IP Address
        id: get-ip
        run: |
          ip=$(curl -s https://api.ipify.org)
          echo "runner_ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Runner IP Address: $ip"

      - name: Add Runner IP to App Service Access Restrictions
        run: |
          ip="${{ steps.get-ip.outputs.runner_ip }}"
          echo "Adding IP $ip to access restrictions..."
          az webapp config access-restriction add \
            --resource-group "${{vars.AZURE_RESOURCE_GROUP}}" \
            --name " ${{vars.AZURE_WEBAPP_NAME}}" \
            --rule-name "GitHub Runner IP" \
            --action Allow \
            --ip-address "${ip}/32" \
            --priority 100 \
            --scm-site true
        continue-on-error: true


      - name: Deploy Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{vars.AZURE_WEBAPP_NAME }}
          package: .

      - name: Remove Runner IP from Access Restrictions
        if: always()
        run: |
          echo "Cleaning up: Removing GitHub Runner IP from access restrictions..."
          az webapp config access-restriction remove \
            --resource-group "${{vars.AZURE_RESOURCE_GROUP}}" \
            --name " ${{vars.AZURE_WEBAPP_NAME}}" \
            --rule-name "GitHub Runner IP" \
            --scm-site true
        continue-on-error: true

      - name: Azure Logout
        if: always()
        run: az logout

      - name: Deployment Status
        run: echo "Successfully deployed to $AZURE_WEBAPP_NAME in ${{ inputs.environment_name }} from run ${{ steps.resolve-run.outputs.run_id }}"
